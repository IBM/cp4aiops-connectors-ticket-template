apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: testtemplate
spec:
  commonName: testtemplate
  dnsNames:
    - testtemplate
    - localhost
    - testtemplate.katamari
    - testtemplate.katamari.svc
  duration: 2160h0m0s
  issuerRef:
    kind: Issuer
    name: aiops-installation-tls-ca
  renewBefore: 720h0m0s
  secretName: testtemplate-cert-secret
  usages:
    - digital signature
    - key encipherment
    - server auth